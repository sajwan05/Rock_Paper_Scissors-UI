<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors UI</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script defer src="./js/index.js"></script>
</head>
<body>
    
    <div class="wrapper">
        
        <header>
            <h1>Rock Paper Scissors</h1>
            <p>Choose your move and see who wins!</p>
        </header>

        <main>
            <section>
                <div class="computerChoice"></div>
                <div class="userChoice"></div>
            </section>

            <section class="user-choices">
                <div class="rock">Rock</div>
                <div class="scissors">Scissors</div>
                <div class="paper">Paper</div>
            </section>
            <section class="score">
                <div class="your-score"></div>
                <div class="computer-score"></div>
            </section>
            <section class="won"></section>

        </main>

        <footer>
            <h2>Rules:</h2>
            <p><span>Rock beats Scissors</span> | <span>Scissors beats Paper</span> | <span>Paper beats Rock</span></p>
        </footer>
    </div>
</body>
</html>
