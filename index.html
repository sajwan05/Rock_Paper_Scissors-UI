<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors UI</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script defer src="./js/index.js"></script>
</head>
<body>
    
    <div class="wrapper">
        
        <header>
            <h1>Rock Paper Scissors</h1>
            <p>Choose your move and see who wins!</p>
        </header>

        <main>
            <div class="choose">
                <div class="user">
                    <h1>You</h1>
                    <div class="user-choice"></div>
                </div>
                <div class="bot">
                    <h1>Computer</h1>
                    <div class="bot-choice"></div>
                </div>
            </div>

            <div class="human-choices">
                <button class="rock">Rock</button>
                <button class="scissors">Scissors</button>
                <button class="paper">Paper</button>
            </div>

            <div class="score">
                <div class="user">
                    <h1>You</h1>
                    <div class="humanScore"></div>
                </div>

                <div class="bot">
                    <h1>Computer</h1>
                    <div class="computerScore"></div>
                </div>
            </div>

            <div class="result">
                <h2 class="output"></h2>
            </div>

            <div class="finalScore">
                <div class="winner">
                    <h1>Game Result:</h1>
                    <p class="final-result"></p>
                </div>
            </div>

        </main>

        <footer>
            <h2>Rules:</h2>
            <p><span>Rock beats Scissors</span> | <span>Scissors beats Paper</span> | <span>Paper beats Rock</span></p>
        </footer>
    </div>
</body>
</html>
